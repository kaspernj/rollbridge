# Build placement for this repository.
#
# Home runners reach the build farm through the multi-gateway Socketduct transport
# set, whose zyxel route class is intentionally offline. A fresh build can lose its
# first transport open on that dead route, which fails the build before any script
# runs. Until the client prefers an available route before the first open, these
# builds run on the VPS runner, which is not behind that transport.
docker_server_names:
  - Server 3

before_script:
  - npm install

script:
  - npm run all-checks
